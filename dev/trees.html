<!doctype html>
<meta charset="utf-8"><title>trees preview</title>
<style>html,body{margin:0;height:100%;background:#070b14;overflow:hidden}canvas{display:block}#t{position:fixed;left:8px;top:6px;color:#cde;font:12px monospace;white-space:pre}</style>
<script type="importmap">
{ "imports": {
    "three": "../node_modules/three/build/three.webgpu.js",
    "three/webgpu": "../node_modules/three/build/three.webgpu.js",
    "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
<div id="t"></div>
<script type="module">
// Dev tool: /dev/trees.html?cam=hero|forest|close|under|top|tip|old&moon=side|game&shadow=1|0
// Night scene with the project's moon rig, the 3 tree variants side by side (hero row, 6 m) and an instanced forest of 60 more.
// Sets window.__trees = { triangles, variants: [{ name, trunkTris, canopyTris }], trees, drawCalls } when drawn.
import * as THREE from 'three';
import { createTrees, variantOf, buildTreeVariant, TREE_VARIANTS } from '../src/trees.js';

const q = new URLSearchParams(location.search), cam_ = q.get('cam') || 'hero';
const renderer = new THREE.WebGPURenderer({ antialias: true }); await renderer.init();
renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = q.get('shadow') !== '0';
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14); scene.fog = new THREE.FogExp2(0x0b1222, 0.0105);
scene.add(new THREE.HemisphereLight(0x33477a, 0x10131a, 1.3));
const moon = new THREE.DirectionalLight(0xa9bfff, 2.1);
moon.position.set(...(q.get('moon') === 'game' ? [-40, 70, -30] : [-45, 45, 25]));
moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 220 });
moon.shadow.bias = -0.0005; moon.shadow.normalBias = 0.04;
scene.add(moon, moon.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x3a424d, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// bark: the project's Poly Haven textures, uv = metres / 1.5
const tl = new THREE.TextureLoader(), tex = (f, srgb) => Object.assign(tl.load('../assets/textures/bark/' + f), { colorSpace: srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, anisotropy: 8 });
const bark = new THREE.MeshStandardMaterial({ map: tex('diff.jpg', true), normalMap: tex('nor.jpg'), roughnessMap: tex('rough.jpg'), roughness: 1 });
bark.userData.tileMeters = 1.5;

// trees[i] gets variant variantOf(i): the first of each variant goes to the hero row, the rest into the forest
const seed = 5, trees = [], hero = [false, false, false]; let s = 12345;
const rnd = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
for (let i = 0; trees.length < 63; i++) {
  const v = variantOf(i, seed);
  if (!hero[v]) { hero[v] = true; trees.push({ x: (v - 1) * 6, y0: 0, z: 0, h: 6 }); }
  else trees.push({ x: (rnd() - 0.5) * 70, y0: 0, z: -14 - rnd() * 45, h: 5 + rnd() * 3 });
}
const group = createTrees({ trees, barkMaterial: bark, seed });
scene.add(group);

const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
const views = { hero: [[0, 3, 11], [0, 3.1, 0]], forest: [[-6, 1.7, -6], [3, 3, -40]], close: [[-6, 3.4, 5.6], [-6, 3.7, 0]], under: [[0, 1.0, 3.5], [0, 4.2, 0]], top: [[0, 24, 6], [0, 0, -2]], tip: [[-3.4, 3.0, 3.2], [-5, 3.2, 0.6]], old: [[2.2, 3.4, 6.5], [6, 4, 0]] };
const [from, to] = views[cam_] || views.hero;
cam.position.set(...from); cam.lookAt(...to);
if (cam_ === 'hero') moon.target.position.set(0, 0, -10);

try {
  renderer.render(scene, cam);
  await new Promise((res) => setTimeout(res, 2500)); // textures arrive after the first draw
  renderer.render(scene, cam);
  const variants = TREE_VARIANTS.map((v, i) => { const g = buildTreeVariant(i); return { name: v.name, trunkTris: g.trunk.index.count / 3, canopyTris: g.canopy.index.count / 3 }; });
  window.__trees = { triangles: group.userData.triangles, variants, trees: trees.length, drawCalls: renderer.info.render.calls };
  document.getElementById('t').textContent = `${cam_}  ${trees.length} trees  ${Math.round(group.userData.triangles / 1000)}k tris  ` + variants.map((v) => `${v.name} ${v.trunkTris + v.canopyTris}`).join(' / ');
} catch (e) { window.__trees = { error: String(e && e.message || e) }; document.getElementById('t').textContent = 'ERROR ' + e; }
</script>
